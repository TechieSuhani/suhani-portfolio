services:
  - type: web
    name: suhani-portfolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: CLIENT_ORIGIN
        value: https://suhani-portfolio.onrender.com

  - type: web
    name: suhani-portfolio
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://suhani-portfolio-api.onrender.com
